name = "env-watcher"
compatibility_date = "2026-01-21"
compatibility_flags = [ "nodejs_compat" ]
main = "dist/_worker.js/index.js"

[assets]
directory = "./dist"

[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = true
persist = true
head_sampling_rate = 1